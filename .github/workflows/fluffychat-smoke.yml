name: Le Fil Talk - test Android sans recompilation

on:
  workflow_dispatch:
  push:
    branches: [fluffychat-reprise]
    paths: ['.github/workflows/fluffychat-smoke.yml', 'tools/fluffychat_smoke.sh']

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Précontrôle identité avant le long build
        run: |
          set -euo pipefail
          bash -n tools/fluffychat_smoke.sh
          python3 -m py_compile tools/brand_fluffychat.py
          grep -Fq "applicationName<String>('chat.fluffy.application_name', 'Le Fil Talk')" tools/brand_fluffychat.py
          grep -Fq "Se relier malgré la distance et la dispersion" tools/brand_fluffychat.py
          grep -Fq "Autre méthode de connexion" tools/brand_fluffychat.py
      - name: Compiler la variante x86-64 compatible avec l'émulateur
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.11.5 https://github.com/krille-chan/fluffychat.git fluffychat
          python3 -m pip install --user Pillow
          python3 tools/brand_fluffychat.py
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Vérifier et compiler pour x86-64 seulement
        working-directory: fluffychat
        run: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --target-platform android-x64
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/x86_64/libflutter.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libapp.so'
          mkdir -p ../release-apk
          cp "$APK" ../release-apk/Le-Fil-Talk-FluffyChat-test.apk
      - name: Vérifier Android SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Installer et lancer APK sur Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/tools/fluffychat_smoke.sh"
      - name: Archiver écran et logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: le-fil-talk-preuve-demarrage
          path: lefil-fluffychat-smoke/
          if-no-files-found: warn
