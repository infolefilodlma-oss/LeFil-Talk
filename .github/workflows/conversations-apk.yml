name: Conversations — APK Le Fil Talk (essai isolé)
# Reconstruction du logo rond officiel du Fil Talk

on:
  push:
    branches: [conversations-apk]
    paths: ['.github/workflows/conversations-apk.yml', 'LogoLeFilTalk.png']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Sources du Fil et logo existant
        uses: actions/checkout@v4
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK Android préinstallé
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Source officielle Conversations
        run: |
          set -euo pipefail
          git clone --depth 1 https://codeberg.org/iNPUTmice/Conversations.git upstream
          git -C upstream rev-parse HEAD | tee conversations-source-sha.txt
      - name: Logo, nom et identifiant propres à la version d'essai
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw,ImageChops
          import re
          root=Path("upstream")
          gradle=root/"build.gradle"
          assert gradle.is_file(), "Fichier Gradle amont non trouvé"
          source=gradle.read_text()
          # Conserver le code et les fonctions XMPP. Ne modifier que l'identité du paquet.
          matches=list(re.finditer(r'(?m)^(\s*applicationId\s*(?:=\s*)?["\'])eu\.siacs\.conversations(["\'])',source))
          assert len(matches)==1, "Format applicationId inconnu : arrêt sans changement"
          source=source[:matches[0].start()]+matches[0].group(1)+"net.lefil.conversations"+matches[0].group(2)+source[matches[0].end():]
          gradle.write_text(source)
          # Le nom d'application est defini par appName dans build.gradle amont.
          # Pas de renommage global du code XMPP.
          source=gradle.read_text()
          newer,n=re.subn(r"""(appName\s*(?:=\s*)?["'])Conversations(["'])""",r'\g<1>Le Fil Talk\g<2>',source)
          if n:
              gradle.write_text(newer)
          print("Noms d'application adaptes dans build.gradle:",n)
          image=Image.open("LogoLeFilTalk.png").convert("RGBA")
          assert image.width>=256 and image.height>=256, "Logo trop petit"
          manifest=root/"src/main/AndroidManifest.xml"
          assert manifest.is_file(), "Manifeste Android principal introuvable"
          ms=manifest.read_text()
          ms,count=re.subn(r'android:icon="@(?:drawable|mipmap)/[^"]+"', 'android:icon="@mipmap/lefil_launcher"', ms)
          assert count==1, "Icône de lancement non identifiée dans le manifeste"
          ms=re.sub(r'android:roundIcon="@(?:drawable|mipmap)/[^"]+"','android:roundIcon="@mipmap/lefil_launcher"',ms)
          manifest.write_text(ms)
          # Le manifest du flavor Conversations definit lui aussi l'icône ;
          # harmoniser les deux pour éviter une erreur du fusionneur Android.
          flavor=root/"src/conversations/AndroidManifest.xml"
          assert flavor.is_file(), "Manifeste du flavor Conversations introuvable"
          fs=flavor.read_text()
          fs,nf=re.subn(r'android:icon="@(?:drawable|mipmap)/[^"]+"','android:icon="@mipmap/lefil_launcher"',fs)
          assert nf==1, "Icône du flavor Conversations introuvable"
          fs=re.sub(r'android:roundIcon="@(?:drawable|mipmap)/[^"]+"','android:roundIcon="@mipmap/lefil_launcher"',fs)
          flavor.write_text(fs)
          sizes={"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              dest=root/"src/main/res"/folder/"lefil_launcher.png"
              dest.parent.mkdir(parents=True,exist_ok=True)
              high=size*4
              fitted=ImageOps.fit(image,(high,high),method=Image.Resampling.LANCZOS)
              mask=Image.new("L",(high,high),0)
              ImageDraw.Draw(mask).ellipse((0,0,high-1,high-1),fill=255)
              fitted.putalpha(ImageChops.multiply(fitted.getchannel("A"),mask))
              rounded=fitted.resize((size,size),Image.Resampling.LANCZOS)
              assert rounded.getpixel((0,0))[3]==0
              rounded.save(dest)
          print(f"Marque Le Fil Talk: {n} paramètres de nom, {len(sizes)} logos et manifeste modifié")

      - name: Compiler la version libre sans changement XMPP
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleConversationsFreeDebug
      - name: Contrôler le résultat et réunir les preuves
        run: |
          set -euo pipefail
          find upstream/build/outputs/apk -type f -name '*.apk' -size +100000c -print | tee apks.txt
          test -s apks.txt
          APK="$(head -n 1 apks.txt)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:" | tee identity.txt
          grep -q "name='net.lefil.conversations'" identity.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signature.txt
          sha256sum "$APK" | tee sha256.txt
          mkdir -p result
          cp "$APK" result/Le-Fil-Talk-Conversations-ESSAI.apk
          cp sha256.txt identity.txt signature.txt conversations-source-sha.txt result/
      - name: APK téléchargeable et rapports de vérification
        uses: actions/upload-artifact@v4
        with:
          name: lefil-talk-conversations-essai-android
          path: result/
          if-no-files-found: error
          retention-days: 14
