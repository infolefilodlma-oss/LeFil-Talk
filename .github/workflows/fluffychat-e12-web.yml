name: "Le Fil Echo - E12 Web (manuel, sans deploiement)"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fluffychat-e12-web.yml"

permissions:
  contents: read

concurrency:
  group: lefil-echo-e12-web
  cancel-in-progress: false

jobs:
  build-web:
    name: "Construire E12 chez GitHub seulement"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: "Importer les personnalisations E12 existantes"
        uses: actions/checkout@v4
        with:
          ref: 36aadf9f3bdcd1600654d0814e89401175f2517d
          path: lefil-e12
          persist-credentials: false

      - name: "Verrouiller et controler les deux fichiers E12"
        shell: bash
        run: |
          set -euo pipefail
          src="lefil-e12/e12-customizations"
          test -s "$src/lib/pages/intro/intro_page.dart"
          test -s "$src/assets/logo/mini/le_fil_echo_logo.jpg"
          file --mime-type "$src/assets/logo/mini/le_fil_echo_logo.jpg" | grep -Fq 'image/jpeg'
          grep -Fq 'Comme le suggère' "$src/lib/pages/intro/intro_page.dart"
          grep -Fq 'Pourquoi Le Fil a-t-il choisi Matrix ?' "$src/lib/pages/intro/intro_page.dart"
          grep -Fq 'pour sa messagerie Écho' "$src/lib/pages/intro/intro_page.dart"
          grep -Fq 'le_fil_echo_logo.jpg' "$src/lib/pages/intro/intro_page.dart"
          grep -Fq 'onPressed: login' "$src/lib/pages/intro/intro_page.dart"
          grep -Fq 'loginWithMatrixId' "$src/lib/pages/intro/intro_page.dart"
          sha256sum "$src/lib/pages/intro/intro_page.dart" "$src/assets/logo/mini/le_fil_echo_logo.jpg"

      - name: "Recuperer la version officielle FluffyChat 2.11.5"
        uses: actions/checkout@v4
        with:
          repository: krille-chan/fluffychat
          ref: v2.11.5
          path: fluffychat
          persist-credentials: false

      - name: "Appliquer uniquement la page et le logo deja personnalises"
        shell: bash
        run: |
          set -euo pipefail
          src="lefil-e12/e12-customizations"
          cp "$src/lib/pages/intro/intro_page.dart" fluffychat/lib/pages/intro/intro_page.dart
          cp "$src/assets/logo/mini/le_fil_echo_logo.jpg" fluffychat/assets/logo/mini/le_fil_echo_logo.jpg
          cmp "$src/lib/pages/intro/intro_page.dart" fluffychat/lib/pages/intro/intro_page.dart
          cmp "$src/assets/logo/mini/le_fil_echo_logo.jpg" fluffychat/assets/logo/mini/le_fil_echo_logo.jpg
          diff -u <(printf '%s\n' lib/pages/intro/intro_page.dart) <(git -C fluffychat diff --name-only) || {
            echo "::error::Des fichiers suivis hors E12 sont modifies"; exit 1;
          }
          echo "Sources officielles, modifications limitees aux deux ressources E12"

      - name: "Installer Flutter selon la version officielle"
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: fluffychat/.fvmrc
          cache: true

      - name: "Installer Rust selon la procedure officielle"
        uses: dtolnay/rust-toolchain@stable

      - name: "Preparer Rust Web comme dans le workflow officiel"
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: "Resoudre les dependances Flutter"
        working-directory: fluffychat
        run: flutter pub get

      - name: "Preparer le Web avec le script officiel FluffyChat"
        working-directory: fluffychat
        run: ./scripts/prepare-web.sh

      - name: "Compiler seulement la version Web"
        working-directory: fluffychat
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --source-maps --base-href "/"

      - name: "Ajouter et verifier config.json dans le build Web"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = {
              "applicationName": "Le Fil Echo",
              "defaultHomeserver": "matrix.org",
          }
          dest = Path("fluffychat/build/web/config.json")
          if not dest.parent.is_dir():
              raise SystemExit("Build Web introuvable")
          dest.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          actual = json.loads(dest.read_text(encoding="utf-8"))
          assert actual == config, "Configuration E12 incorrecte"
          print("config.json integre au build et valide")
          PY

      - name: "Verifier la sortie sans deployer"
        shell: bash
        run: |
          set -euo pipefail
          test -s fluffychat/build/web/index.html
          test -s fluffychat/build/web/flutter_bootstrap.js
          test -s fluffychat/build/web/config.json
          test -s fluffychat/build/web/assets/assets/logo/mini/le_fil_echo_logo.jpg
          sha256sum fluffychat/build/web/assets/assets/logo/mini/le_fil_echo_logo.jpg
          echo "Build disponible sous GitHub Actions, AUCUN deploiement."

      - name: "Test de demarrage reel dans Chromium (bloquant)"
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory fluffychat/build/web >/tmp/lefil-e12-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          mkdir -p e12-test-proofs
          node <<'JS'
          const {chromium} = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              for (const device of [
                {name:'desktop',viewport:{width:1280,height:900}},
                {name:'mobile',viewport:{width:390,height:844}},
              ]) {
                const context = await browser.newContext({viewport:device.viewport,serviceWorkers:'block'});
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(String(e)));
                page.on('console', m => {if(m.type()==='error') errors.push('console: '+m.text());});
                const response = await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
                if (!response || response.status()!==200) throw Error(device.name+': HTTP incorrect');
                const screenshot='e12-test-proofs/'+device.name+'.png';
                let viewReady = false;
                try {
                  await page.locator('flutter-view').first().waitFor({state:'attached',timeout:60000});
                  viewReady = true;
                  await page.waitForTimeout(8000);
                } finally {
                  await page.screenshot({path:screenshot,fullPage:true}).catch(e=>console.error('Capture impossible:',e));
                  fs.writeFileSync('e12-test-proofs/'+device.name+'-console.json',JSON.stringify({
                    url:page.url(),title:await page.title().catch(()=>''),viewReady,
                    errors,html:await page.locator('body').innerHTML().catch(()=>''), 
                  },null,2));
                }
                if (!viewReady) throw Error(device.name+': interface Flutter non rendue, consulter capture et journal');
                if (fs.statSync(screenshot).size < 10000) throw Error(device.name+': capture anormalement petite');
                if (errors.length) throw Error(device.name+': erreurs navigateur: '+errors.join(' | '));
                console.log(device.name+': Flutter monte, aucune exception, capture '+screenshot);
                await context.close();
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: "Conserver les preuves navigateur meme en cas d'echec"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeFil-Echo-E12-Preuves-Navigateur
          path: e12-test-proofs/
          if-no-files-found: ignore
          retention-days: 14

      - name: "Archiver le build pour validation ulterieure"
        uses: actions/upload-artifact@v4
        with:
          name: LeFil-Echo-E12-Web-A-VALIDER
          path: fluffychat/build/web/
          if-no-files-found: error
          retention-days: 14
