name: Element X - diagnostic compilation Android

on:
  workflow_dispatch:
  push:
    branches:
      - element-x-matrixorg-reprise

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Récupérer les scripts du Fil Talk
        uses: actions/checkout@v4
      - name: Java 21 (requis par Metro 1.4.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Checkout Element X Android - source identifiée
        run: |
          git clone --depth 1 --branch v26.10.1 https://github.com/element-hq/element-x-android.git upstream
          cd upstream
          git rev-parse HEAD | tee ../upstream-commit.txt
      - name: Appliquer l'identité Le Fil Talk sans toucher à Matrix
        run: python3 tools/brand_candidate.py
      - name: Vérifier le logo officiel et appliquer les ressources Android
        run: |
          python3 -m pip install --user Pillow
          python3 tools/apply_visual_brand.py
      - name: Intégrer Poppins à la typographie native Element X
        run: python3 tools/apply_poppins.py
      - name: Appliquer les couleurs natives Le Fil Talk (clair/sombre)
        run: python3 tools/apply_theme_colors.py
      - name: Aide inscription matrix.org dans le parcours Element X
        run: python3 tools/apply_signup_help.py
      - name: Installer accueil Le Fil, Papote, Sentiers et Oasis
        run: python3 tools/apply_lefil_welcome.py
      - name: Ajouter navigation Le Fil connectée aux fonctions natives
        run: python3 tools/apply_lefil_navigation.py
      - name: Vérifier la validité des fonds du logo adaptatif
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for variant in ('debug', 'nightly', 'release'):
              p = Path('upstream/appicon/element/src') / variant / 'res/drawable/ic_launcher_background.xml'
              ET.parse(p)
              print('XML valide:', p)
          PY
      - name: Conserver la preuve du logo utilisé dans la compilation
        run: |
          sha256sum LogoLeFilTalk.png | tee logo-sha256.txt
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("LogoLeFilTalk.png")
          im.verify()
          im = Image.open("LogoLeFilTalk.png")
          assert im.size == (1254, 1254), f"Logo inattendu: {im.size}"
          print("Logo officiel PNG 1254 x 1254 vérifié")
          PY
      - name: Compiler APK Le Fil Talk debug - non distribuer
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:assembleFdroidDebug
      - name: Vérifier artefact et empreinte
        run: |
          find upstream/app/build/outputs/apk/fdroid/debug -type f -name '*.apk' -size +0c -print -exec sha256sum {} \; | tee apk-checks.txt
          grep -q '\.apk' apk-checks.txt
      - name: Contrôler identité et signature de l'APK ARM64
        shell: bash
        run: |
          set -euo pipefail
          APK="upstream/app/build/outputs/apk/fdroid/debug/app-fdroid-arm64-v8a-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep '^package:' | tee apk-identity.txt
          grep -q "name='net.lefil.talk.debug'" apk-identity.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-signature.txt
          grep -q 'Verified using v2 scheme' apk-signature.txt
          sha256sum "$APK" | tee apk-arm64-sha256.txt
      - name: Archiver APK test ARM64 avant démarrage de l'émulateur
        uses: actions/upload-artifact@v4
        with:
          name: lefil-talk-arm64-test-non-publiable
          path: |
            upstream/app/build/outputs/apk/fdroid/debug/app-fdroid-arm64-v8a-debug.apk
            upstream-commit.txt
            apk-checks.txt
            logo-sha256.txt
            apk-identity.txt
            apk-signature.txt
            apk-arm64-sha256.txt
          if-no-files-found: error
      - name: Installer et démarrer Le Fil Talk sur Android 15 (émulateur)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            mkdir -p lefil-talk-ui-proof
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb shell input keyevent 82
            adb install -r upstream/app/build/outputs/apk/fdroid/debug/app-fdroid-x86_64-debug.apk
            adb shell pm path net.lefil.talk.debug | grep -q package:
            adb logcat -c || true
            adb shell am start -W -n net.lefil.talk.debug/io.element.android.x.MainActivity > lefil-talk-ui-proof/launch.txt 2>&1 || true
            cat lefil-talk-ui-proof/launch.txt
            sleep 8
            adb shell pidof net.lefil.talk.debug > lefil-talk-ui-proof/pid.txt || true
            adb logcat -d -t 1500 > lefil-talk-ui-proof/logcat.txt || true
            adb shell screencap -p /sdcard/lefil-talk-start.png
            adb pull /sdcard/lefil-talk-start.png lefil-talk-ui-proof/startup-android15.png
            adb shell uiautomator dump /sdcard/lefil-talk-ui.xml
            adb pull /sdcard/lefil-talk-ui.xml lefil-talk-ui-proof/startup-hierarchy.xml
            test -s lefil-talk-ui-proof/pid.txt || { echo "::error::Le Fil Talk ne reste pas lancé"; exit 1; }
            ! grep -Eqi "System UI isn't responding|isn't responding|Close app|ne répond pas" lefil-talk-ui-proof/startup-hierarchy.xml
            echo "Processus Le Fil Talk présent, capture et journaux archivés."
      - name: Archiver preuves visuelles Android 15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefil-talk-android15-capture-visuelle
          path: lefil-talk-ui-proof/
          if-no-files-found: warn
