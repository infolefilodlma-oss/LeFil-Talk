name: Element X - diagnostic compilation Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/element-x-candidate.yml'
      - 'tools/brand_candidate.py'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Récupérer les scripts du Fil Talk
        uses: actions/checkout@v4
      - name: Java 21 (requis par Metro 1.4.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Checkout Element X Android - source identifiée
        run: |
          git clone --depth 1 --branch v26.10.1 https://github.com/element-hq/element-x-android.git upstream
          cd upstream
          git rev-parse HEAD | tee ../upstream-commit.txt
      - name: Appliquer l'identité Le Fil Talk sans toucher à Matrix
        run: python3 tools/brand_candidate.py
      - name: Vérifier les préconditions des notifications Matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path("upstream/plugins/src/main/kotlin/config/BuildTimeConfig.kt").read_text()
          service = Path("upstream/libraries/push/impl/src/main/kotlin/io/element/android/libraries/push/impl/DefaultPushService.kt").read_text()
          gradle = Path("upstream/app/build.gradle.kts").read_text()
          checks = {
              "UnifiedPush inclus": 'const val PUSH_CONFIG_INCLUDE_UNIFIED_PUSH: Boolean = true' in config,
              "Vérification de session requise": 'SessionVerifiedStatus.Verified' in service,
              "Échec explicite sans distributeur": 'NoDistributorsAvailable()' in service,
              "Identifiant debug explicite": 'applicationIdSuffix = ".debug"' in gradle,
          }
          for label, ok in checks.items():
              print(f"{label}: {'OK' if ok else 'ÉCHEC'}")
          if not all(checks.values()):
              raise SystemExit("Préconditions notifications modifiées : examiner avant livraison")
          PY
      - name: Compiler APK Le Fil Talk debug - non distribuer
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFdroidDebug
      - name: Vérifier artefact et empreinte
        run: |
          find upstream/app/build/outputs/apk/fdroid/debug -type f -name '*.apk' -size +0c -print -exec sha256sum {} \; | tee apk-checks.txt
          grep -q '\.apk' apk-checks.txt
      - name: Archiver APK test ARM64 avant démarrage de l'émulateur
        uses: actions/upload-artifact@v4
        with:
          name: lefil-talk-arm64-test-non-publiable
          path: |
            upstream/app/build/outputs/apk/fdroid/debug/app-fdroid-arm64-v8a-debug.apk
            upstream-commit.txt
            apk-checks.txt
          if-no-files-found: error
      - name: Installer et démarrer Le Fil Talk sur Android 15 (émulateur)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r upstream/app/build/outputs/apk/fdroid/debug/app-fdroid-x86_64-debug.apk
            adb shell pm path net.lefil.talk.debug | grep -q package:
            adb shell monkey -p net.lefil.talk.debug 1
            sleep 10
            adb shell pidof net.lefil.talk.debug
